[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formwork"
dynamic = ["version"]
description = "Declare which fields your rule engine owns and which the model may invent, then guarantee the domain rules hold."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ekber Gulpinar" }]
keywords = ["llm", "structured-output", "constraints", "validation", "pydantic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
gemini = ["google-genai>=1.0"]
# Everything needed to run the live tests and the benchmark against real models.
live = ["formwork[gemini]", "python-dotenv>=1.0"]

[project.urls]
Homepage = "https://github.com/ekberglpnar/formwork"
Issues = "https://github.com/ekberglpnar/formwork/issues"

# Single source of truth for the version: __init__.py. Keeping it in both places
# lets pip show and formwork.__version__ drift apart without anyone noticing.
[tool.hatch.version]
path = "src/formwork/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/formwork"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Live tests are opt-in. Without this, anyone who filled in .env to run the
# benchmark would spend real quota every time they ran the test suite, which is
# not something a contributor should discover from their billing page.
# Run them deliberately with: pytest -m live
addopts = "-m 'not live'"
markers = [
  "live: hits a real provider; costs money and needs an API key. Opt in with -m live.",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["formwork"]

# google-genai is an optional extra and ships no type information. The library
# must type-check whether or not it is installed, which is what CI does: it
# installs [dev] only. _load_sdk() already types the SDK as Any, so nothing is
# lost by silencing the import here.
[[tool.mypy.overrides]]
module = ["google", "google.*"]
ignore_missing_imports = true
