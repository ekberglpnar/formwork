[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formwork"
version = "0.1.0"
description = "Declare which fields your rule engine owns and which the model may invent, then guarantee the domain rules hold."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ekber Gulpinar" }]
keywords = ["llm", "structured-output", "constraints", "validation", "pydantic"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
gemini = ["google-genai>=1.0"]
# Everything needed to run the live tests and the benchmark against real models.
live = ["formwork[gemini]", "python-dotenv>=1.0"]

[project.urls]
Homepage = "https://github.com/ekberglpnar/formwork"
Issues = "https://github.com/ekberglpnar/formwork/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/formwork"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live: hits a real provider; costs money and needs an API key. Skipped without one.",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["formwork"]
