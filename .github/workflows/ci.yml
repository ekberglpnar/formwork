name: ci

# Triggered only by push and pull_request, and nothing in this workflow
# interpolates event data (titles, branch names, commit messages) into a shell.
# The only expression used is the static matrix value below.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only need to read the checkout.
permissions:
  contents: read

# A push to a branch makes the run already in flight for that branch obsolete.
# main is excluded: its runs are the record of what was released from it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests examples bench scripts

      - name: Types
        run: mypy

      - name: Tests
        run: pytest -q

      - name: Example runs
        run: python examples/workout.py > /dev/null
